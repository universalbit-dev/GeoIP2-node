name: Snyk Security

on:
  push:
    branches: ["geoip2-maltiverse", "main"]
  pull_request:
    branches: ["geoip2-maltiverse"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Add Node.js setup (CRITICAL for npm dependency analysis)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      # Use release tag instead of commit hash
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        # Or use specific version: @v0.4.0

      - name: Snyk Code test
        run: snyk code test --sarif 1> snyk-code.sarif 2>&1 || true

      - name: Validate SARIF file
        id: check_sarif
        run: |
          if [ -s snyk-code.sarif ] && python3 -c "import json,sys; json.load(open('snyk-code.sarif'))" 2>/dev/null; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "SARIF file is empty or invalid JSON — skipping upload."
          fi

      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects || true

      - name: Snyk IaC test and report
        run: snyk iac test --report || true

      - name: Upload result to GitHub Code Scanning
        if: steps.check_sarif.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
