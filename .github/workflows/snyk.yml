name: Snyk Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write      # Needed for 'snyk fix' and PR creation
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Run Snyk test
        uses: snyk/actions/node@v3
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk monitor
        uses: snyk/actions/node@v3
        with:
          command: monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Optional: Try 'snyk fix' to automatically open fix PRs (experimental)
      - name: Snyk fix and create PR (Optional)
        run: npx snyk fix || echo "Snyk fix failed (optional step)."
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
